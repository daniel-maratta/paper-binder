name: paperbinder-test

x-paperbinder-runtime-environment: &paperbinder-runtime-environment
  PAPERBINDER_DB_CONNECTION: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
  PAPERBINDER_PUBLIC_ROOT_URL: ${PAPERBINDER_PUBLIC_ROOT_URL}
  PAPERBINDER_AUTH_COOKIE_DOMAIN: ${PAPERBINDER_AUTH_COOKIE_DOMAIN}
  PAPERBINDER_AUTH_COOKIE_NAME: ${PAPERBINDER_AUTH_COOKIE_NAME}
  PAPERBINDER_AUTH_KEY_RING_PATH: /data/keys
  PAPERBINDER_CHALLENGE_SITE_KEY: ${PAPERBINDER_CHALLENGE_SITE_KEY}
  PAPERBINDER_CHALLENGE_SECRET_KEY: ${PAPERBINDER_CHALLENGE_SECRET_KEY}
  PAPERBINDER_CHALLENGE_LOCAL_BYPASS_ENABLED: ${PAPERBINDER_CHALLENGE_LOCAL_BYPASS_ENABLED:-false}
  PAPERBINDER_LEASE_DEFAULT_MINUTES: ${PAPERBINDER_LEASE_DEFAULT_MINUTES}
  PAPERBINDER_LEASE_EXTENSION_WINDOW_MINUTES: ${PAPERBINDER_LEASE_EXTENSION_WINDOW_MINUTES:-10}
  PAPERBINDER_LEASE_EXTENSION_MINUTES: ${PAPERBINDER_LEASE_EXTENSION_MINUTES:-15}
  PAPERBINDER_LEASE_MAX_EXTENSIONS: ${PAPERBINDER_LEASE_MAX_EXTENSIONS}
  PAPERBINDER_LEASE_CLEANUP_INTERVAL_SECONDS: ${PAPERBINDER_LEASE_CLEANUP_INTERVAL_SECONDS}
  PAPERBINDER_RATE_LIMIT_PREAUTH_PER_MINUTE: ${PAPERBINDER_RATE_LIMIT_PREAUTH_PER_MINUTE}
  PAPERBINDER_RATE_LIMIT_AUTHENTICATED_PER_MINUTE: ${PAPERBINDER_RATE_LIMIT_AUTHENTICATED_PER_MINUTE}
  PAPERBINDER_RATE_LIMIT_LEASE_EXTEND_PER_MINUTE: ${PAPERBINDER_RATE_LIMIT_LEASE_EXTEND_PER_MINUTE}
  PAPERBINDER_AUDIT_RETENTION_MODE: ${PAPERBINDER_AUDIT_RETENTION_MODE}

x-paperbinder-logging: &paperbinder-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

services:
  proxy:
    build:
      context: .
      dockerfile: deploy/Caddy.Namecheap.Dockerfile
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    volumes:
      - ./deploy/test/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/test/robots.txt:/srv/paperbinder-test/robots.txt:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      NAMECHEAP_API_KEY: ${NAMECHEAP_API_KEY}
      NAMECHEAP_API_USER: ${NAMECHEAP_API_USER}
      NAMECHEAP_API_ENDPOINT: ${NAMECHEAP_API_ENDPOINT:-https://api.namecheap.com/xml.response}
      NAMECHEAP_CLIENT_IP: ${NAMECHEAP_CLIENT_IP}
    logging: *paperbinder-logging

  app:
    build:
      context: .
      dockerfile: src/PaperBinder.Api/Dockerfile
      args:
        VITE_PAPERBINDER_ROOT_URL: ${VITE_PAPERBINDER_ROOT_URL}
        VITE_PAPERBINDER_API_BASE_URL: ${VITE_PAPERBINDER_API_BASE_URL}
        VITE_PAPERBINDER_TENANT_BASE_DOMAIN: ${VITE_PAPERBINDER_TENANT_BASE_DOMAIN}
        VITE_PAPERBINDER_CHALLENGE_SITE_KEY: ${PAPERBINDER_CHALLENGE_SITE_KEY}
        VITE_PAPERBINDER_CHALLENGE_SCRIPT_URL: ${VITE_PAPERBINDER_CHALLENGE_SCRIPT_URL:-https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit}
        VITE_PAPERBINDER_CHALLENGE_LOCAL_BYPASS_ENABLED: ${VITE_PAPERBINDER_CHALLENGE_LOCAL_BYPASS_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      <<: *paperbinder-runtime-environment
      PAPERBINDER_DATA_PROTECTION_APPLICATION_NAME: ${PAPERBINDER_DATA_PROTECTION_APPLICATION_NAME:-PaperBinder}
      PAPERBINDER_DATA_PROTECTION_CERTIFICATE_PATH: ${PAPERBINDER_DATA_PROTECTION_CERTIFICATE_PATH:-}
      PAPERBINDER_DATA_PROTECTION_CERTIFICATE_PASSWORD: ${PAPERBINDER_DATA_PROTECTION_CERTIFICATE_PASSWORD:-}
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DOTNET_ENVIRONMENT: Production
    restart: unless-stopped
    volumes:
      - paperbinder_keys:/data/keys
      - /opt/paperbinder/secrets/data-protection.pfx:/run/paperbinder-secrets/data-protection.pfx:ro
    logging: *paperbinder-logging

  worker:
    build:
      context: .
      dockerfile: src/PaperBinder.Worker/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
    environment:
      <<: *paperbinder-runtime-environment
      DOTNET_ENVIRONMENT: Production
    restart: unless-stopped
    volumes:
      - paperbinder_keys:/data/keys
    logging: *paperbinder-logging

  migrations:
    build:
      context: .
      dockerfile: src/PaperBinder.Migrations/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PAPERBINDER_DB_CONNECTION: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      DOTNET_ENVIRONMENT: Production
    restart: "no"
    logging: *paperbinder-logging

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${PAPERBINDER_DB_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - paperbinder_postgres:/var/lib/postgresql/data
    logging: *paperbinder-logging

volumes:
  caddy_config:
  caddy_data:
  paperbinder_keys:
  paperbinder_postgres:
