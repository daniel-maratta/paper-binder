name: deploy-test

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Stable SemVer version without the leading v, for example 1.0.0"
        required: true
        type: string
      deploy_path:
        description: "Absolute base install directory on the test droplet; the live app directory is <deploy_path>/app"
        required: true
        default: "/opt/paperbinder"
        type: string

permissions:
  contents: read

concurrency:
  group: test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: test

    steps:
      - name: Resolve deployment version
        id: version
        shell: pwsh
        run: |
          $version = "${{ inputs.version }}"
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Deployment version '$version' is not a stable SemVer core version."
          }

          $deployBasePath = "${{ inputs.deploy_path }}".TrimEnd("/")
          if ([string]::IsNullOrWhiteSpace($deployBasePath)) {
            throw "Deployment base path cannot be empty."
          }

          $owner = $env:GITHUB_REPOSITORY_OWNER.ToLowerInvariant()
          $registry = "ghcr.io/$owner"

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=v$version" >> $env:GITHUB_OUTPUT
          "image_registry=$registry" >> $env:GITHUB_OUTPUT
          "registry_owner=$owner" >> $env:GITHUB_OUTPUT
          "deploy_base_path=$deployBasePath" >> $env:GITHUB_OUTPUT
          "deploy_app_path=$deployBasePath/app" >> $env:GITHUB_OUTPUT

      - name: Checkout requested release tag
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ steps.version.outputs.tag }}

      - name: Validate deployment configuration
        shell: bash
        run: |
          test -n "${{ secrets.TEST_TAILSCALE_OAUTH_CLIENT_ID }}" || { echo "Missing secret TEST_TAILSCALE_OAUTH_CLIENT_ID."; exit 1; }
          test -n "${{ secrets.TEST_TAILSCALE_OAUTH_SECRET }}" || { echo "Missing secret TEST_TAILSCALE_OAUTH_SECRET."; exit 1; }
          test -n "${{ vars.TEST_TAILSCALE_TAGS }}" || { echo "Missing repository or environment variable TEST_TAILSCALE_TAGS."; exit 1; }
          test -n "${{ secrets.TEST_SSH_HOST }}" || { echo "Missing secret TEST_SSH_HOST."; exit 1; }
          test -n "${{ vars.TEST_SSH_USER }}" || { echo "Missing repository or environment variable TEST_SSH_USER."; exit 1; }
          test -n "${{ secrets.TEST_SSH_PRIVATE_KEY }}" || { echo "Missing secret TEST_SSH_PRIVATE_KEY."; exit 1; }
          test -n "${{ secrets.TEST_SSH_KNOWN_HOSTS }}" || { echo "Missing secret TEST_SSH_KNOWN_HOSTS."; exit 1; }
          test -n "${{ secrets.TEST_GHCR_PULL_TOKEN }}" || { echo "Missing secret TEST_GHCR_PULL_TOKEN."; exit 1; }
          test -n "${{ secrets.TEST_POSTGRES_PASSWORD }}" || { echo "Missing secret TEST_POSTGRES_PASSWORD."; exit 1; }
          test -n "${{ vars.TEST_PUBLIC_ROOT_URL }}" || { echo "Missing repository or environment variable TEST_PUBLIC_ROOT_URL."; exit 1; }
          test -n "${{ vars.TEST_AUTH_COOKIE_DOMAIN }}" || { echo "Missing repository or environment variable TEST_AUTH_COOKIE_DOMAIN."; exit 1; }
          test -n "${{ vars.TEST_DATA_PROTECTION_APPLICATION_NAME }}" || { echo "Missing repository or environment variable TEST_DATA_PROTECTION_APPLICATION_NAME."; exit 1; }
          test -n "${{ vars.TEST_DATA_PROTECTION_CERTIFICATE_PATH }}" || { echo "Missing repository or environment variable TEST_DATA_PROTECTION_CERTIFICATE_PATH."; exit 1; }
          test -n "${{ secrets.TEST_DATA_PROTECTION_CERTIFICATE_PASSWORD }}" || { echo "Missing secret TEST_DATA_PROTECTION_CERTIFICATE_PASSWORD."; exit 1; }
          test -n "${{ vars.TEST_TURNSTILE_SITE_KEY }}" || { echo "Missing repository or environment variable TEST_TURNSTILE_SITE_KEY."; exit 1; }
          test -n "${{ secrets.TEST_TURNSTILE_SECRET_KEY }}" || { echo "Missing secret TEST_TURNSTILE_SECRET_KEY."; exit 1; }
          test -n "${{ secrets.TEST_NAMECHEAP_API_USER }}" || { echo "Missing secret TEST_NAMECHEAP_API_USER."; exit 1; }
          test -n "${{ secrets.TEST_NAMECHEAP_API_KEY }}" || { echo "Missing secret TEST_NAMECHEAP_API_KEY."; exit 1; }
          test -n "${{ secrets.TEST_NAMECHEAP_CLIENT_IP }}" || { echo "Missing secret TEST_NAMECHEAP_CLIENT_IP."; exit 1; }

      - name: Join Tailscale tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TEST_TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TEST_TAILSCALE_OAUTH_SECRET }}
          tags: ${{ vars.TEST_TAILSCALE_TAGS }}
          ping: ${{ secrets.TEST_SSH_HOST }}

      - name: Prepare deployment bundle
        env:
          TEST_POSTGRES_PASSWORD: ${{ secrets.TEST_POSTGRES_PASSWORD }}
          TEST_PUBLIC_ROOT_URL: ${{ vars.TEST_PUBLIC_ROOT_URL }}
          TEST_AUTH_COOKIE_DOMAIN: ${{ vars.TEST_AUTH_COOKIE_DOMAIN }}
          TEST_DATA_PROTECTION_APPLICATION_NAME: ${{ vars.TEST_DATA_PROTECTION_APPLICATION_NAME }}
          TEST_DATA_PROTECTION_CERTIFICATE_PATH: ${{ vars.TEST_DATA_PROTECTION_CERTIFICATE_PATH }}
          TEST_DATA_PROTECTION_CERTIFICATE_PASSWORD: ${{ secrets.TEST_DATA_PROTECTION_CERTIFICATE_PASSWORD }}
          TEST_TURNSTILE_SITE_KEY: ${{ vars.TEST_TURNSTILE_SITE_KEY }}
          TEST_TURNSTILE_SECRET_KEY: ${{ secrets.TEST_TURNSTILE_SECRET_KEY }}
          TEST_NAMECHEAP_API_USER: ${{ secrets.TEST_NAMECHEAP_API_USER }}
          TEST_NAMECHEAP_API_KEY: ${{ secrets.TEST_NAMECHEAP_API_KEY }}
          TEST_NAMECHEAP_CLIENT_IP: ${{ secrets.TEST_NAMECHEAP_CLIENT_IP }}
        shell: pwsh
        run: |
          function Format-EnvValue([string] $Value) {
            if ($null -eq $Value) {
              return '""'
            }

            return '"' + $Value.Replace('\', '\\').Replace('"', '\"') + '"'
          }

          $deployRoot = Join-Path (Get-Location) ".deploy/test"
          $deployConfigRoot = Join-Path $deployRoot "deploy/test"
          New-Item -ItemType Directory -Force -Path $deployConfigRoot | Out-Null

          Copy-Item docker-compose.test-deploy.yml (Join-Path $deployRoot "docker-compose.test-deploy.yml")
          Copy-Item deploy/test/Caddyfile (Join-Path $deployConfigRoot "Caddyfile")
          Copy-Item deploy/test/robots.txt (Join-Path $deployConfigRoot "robots.txt")

          $lines = @(
            "PAPERBINDER_IMAGE_REGISTRY=$(Format-EnvValue '${{ steps.version.outputs.image_registry }}')",
            "PAPERBINDER_IMAGE_TAG=$(Format-EnvValue '${{ steps.version.outputs.version }}')",
            "POSTGRES_DB=$(Format-EnvValue 'paperbinder')",
            "POSTGRES_USER=$(Format-EnvValue 'paperbinder')",
            "POSTGRES_PASSWORD=$(Format-EnvValue $env:TEST_POSTGRES_PASSWORD)",
            "PAPERBINDER_PUBLIC_ROOT_URL=$(Format-EnvValue $env:TEST_PUBLIC_ROOT_URL)",
            "PAPERBINDER_AUTH_COOKIE_DOMAIN=$(Format-EnvValue $env:TEST_AUTH_COOKIE_DOMAIN)",
            "PAPERBINDER_AUTH_COOKIE_NAME=$(Format-EnvValue 'paperbinder.auth')",
            "PAPERBINDER_DATA_PROTECTION_APPLICATION_NAME=$(Format-EnvValue $env:TEST_DATA_PROTECTION_APPLICATION_NAME)",
            "PAPERBINDER_DATA_PROTECTION_CERTIFICATE_PATH=$(Format-EnvValue $env:TEST_DATA_PROTECTION_CERTIFICATE_PATH)",
            "PAPERBINDER_DATA_PROTECTION_CERTIFICATE_PASSWORD=$(Format-EnvValue $env:TEST_DATA_PROTECTION_CERTIFICATE_PASSWORD)",
            "PAPERBINDER_CHALLENGE_SITE_KEY=$(Format-EnvValue $env:TEST_TURNSTILE_SITE_KEY)",
            "PAPERBINDER_CHALLENGE_SECRET_KEY=$(Format-EnvValue $env:TEST_TURNSTILE_SECRET_KEY)",
            "PAPERBINDER_LEASE_DEFAULT_MINUTES=$(Format-EnvValue '60')",
            "PAPERBINDER_LEASE_EXTENSION_MINUTES=$(Format-EnvValue '10')",
            "PAPERBINDER_LEASE_MAX_EXTENSIONS=$(Format-EnvValue '3')",
            "PAPERBINDER_LEASE_CLEANUP_INTERVAL_SECONDS=$(Format-EnvValue '60')",
            "PAPERBINDER_RATE_LIMIT_PREAUTH_PER_MINUTE=$(Format-EnvValue '30')",
            "PAPERBINDER_RATE_LIMIT_AUTHENTICATED_PER_MINUTE=$(Format-EnvValue '120')",
            "PAPERBINDER_RATE_LIMIT_LEASE_EXTEND_PER_MINUTE=$(Format-EnvValue '10')",
            "PAPERBINDER_AUDIT_RETENTION_MODE=$(Format-EnvValue 'RetainTenantPurgedSummary')",
            "NAMECHEAP_API_USER=$(Format-EnvValue $env:TEST_NAMECHEAP_API_USER)",
            "NAMECHEAP_API_KEY=$(Format-EnvValue $env:TEST_NAMECHEAP_API_KEY)",
            "NAMECHEAP_CLIENT_IP=$(Format-EnvValue $env:TEST_NAMECHEAP_CLIENT_IP)"
          )

          if (-not [string]::IsNullOrWhiteSpace($env:TEST_OTEL_OTLP_ENDPOINT)) {
            $lines += "PAPERBINDER_OTEL_OTLP_ENDPOINT=$(Format-EnvValue $env:TEST_OTEL_OTLP_ENDPOINT)"
          }

          Set-Content -Path (Join-Path $deployRoot ".env") -Value $lines

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.TEST_SSH_PRIVATE_KEY }}" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "${{ secrets.TEST_SSH_KNOWN_HOSTS }}" | tr -d '\r' > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          test -s ~/.ssh/known_hosts || { echo "known_hosts file is missing or empty."; exit 1; }
          cat <<EOF > ~/.ssh/config
          Host paperbinder-test-deploy
            HostName ${{ secrets.TEST_SSH_HOST }}
            User ${{ vars.TEST_SSH_USER }}
            IdentityFile ~/.ssh/id_ed25519
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            UserKnownHostsFile ~/.ssh/known_hosts
            HostKeyAlias ${{ secrets.TEST_SSH_HOST }}
          EOF
          chmod 600 ~/.ssh/config
          ssh -G paperbinder-test-deploy >/dev/null
          echo "SSH private key parsed successfully."
          echo "SSH known_hosts file is present and non-empty."
          echo "SSH config alias paperbinder-test-deploy created."

      - name: Verify SSH authentication and pinned host identity
        shell: bash
        run: |
          if ! ssh -o BatchMode=yes paperbinder-test-deploy "exit 0"; then
            echo "SSH authentication probe failed. Emitting sanitized client debug output."
            ssh -vv -o BatchMode=yes paperbinder-test-deploy "exit 0" 2>ssh-debug.log || true
            host_pattern="$(printf '%s\n' "${{ secrets.TEST_SSH_HOST }}" | sed 's/[][\\/.*^$]/\\&/g')"
            user_pattern="$(printf '%s\n' "${{ vars.TEST_SSH_USER }}" | sed 's/[][\\/.*^$]/\\&/g')"
            sed \
              -e "s/${host_pattern}/[redacted-host]/g" \
              -e "s/${user_pattern}/[redacted-user]/g" \
              -E 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/[redacted-ip]/g' \
              -E 's/SHA256:[A-Za-z0-9+/=]+/[redacted-fingerprint]/g' \
              ssh-debug.log
            exit 1
          fi

      - name: Create remote deployment directory
        shell: bash
        run: |
          ssh paperbinder-test-deploy "mkdir -p '${{ steps.version.outputs.deploy_app_path }}/deploy/test'"

      - name: Upload deployment bundle
        shell: bash
        run: |
          scp .deploy/test/docker-compose.test-deploy.yml "paperbinder-test-deploy:${{ steps.version.outputs.deploy_app_path }}/docker-compose.test-deploy.yml"
          scp .deploy/test/.env "paperbinder-test-deploy:${{ steps.version.outputs.deploy_app_path }}/.env"
          scp .deploy/test/deploy/test/Caddyfile "paperbinder-test-deploy:${{ steps.version.outputs.deploy_app_path }}/deploy/test/Caddyfile"
          scp .deploy/test/deploy/test/robots.txt "paperbinder-test-deploy:${{ steps.version.outputs.deploy_app_path }}/deploy/test/robots.txt"

      - name: Login remote host to GHCR
        shell: bash
        run: |
          printf '%s\n' "${{ secrets.TEST_GHCR_PULL_TOKEN }}" | ssh paperbinder-test-deploy "docker login ghcr.io -u '${{ steps.version.outputs.registry_owner }}' --password-stdin"

      - name: Deploy release
        shell: bash
        run: |
          ssh paperbinder-test-deploy "
            set -euo pipefail
            cd '${{ steps.version.outputs.deploy_app_path }}'
            docker compose --env-file .env -f docker-compose.test-deploy.yml pull
            docker compose --env-file .env -f docker-compose.test-deploy.yml run --rm migrations
            docker compose --env-file .env -f docker-compose.test-deploy.yml up -d
          "

      - name: Smoke check public health endpoints
        env:
          TEST_PUBLIC_ROOT_URL: ${{ vars.TEST_PUBLIC_ROOT_URL }}
        shell: bash
        run: |
          check_with_retry() {
            local url="$1"
            local attempts="$2"
            local sleep_seconds="$3"
            local label="$4"
            local last_status=0

            for ((attempt = 1; attempt <= attempts; attempt++)); do
              if curl --fail --silent --show-error "$url" >/dev/null; then
                echo "$label passed on attempt $attempt/$attempts."
                return 0
              fi

              last_status=$?
              echo "$label failed on attempt $attempt/$attempts for $url."
              sleep "$sleep_seconds"
            done

            echo "$label failed after $attempts attempts for $url."
            return "$last_status"
          }

          dump_remote_state() {
            ssh paperbinder-test-deploy "
              set -euo pipefail
              cd '${{ steps.version.outputs.deploy_app_path }}'
              echo '== docker compose ps =='
              docker compose --env-file .env -f docker-compose.test-deploy.yml ps || true
              echo '== app logs =='
              docker compose --env-file .env -f docker-compose.test-deploy.yml logs app --since=15m || true
              echo '== proxy logs =='
              docker compose --env-file .env -f docker-compose.test-deploy.yml logs proxy --since=15m || true
            "
          }

          if ! check_with_retry "${TEST_PUBLIC_ROOT_URL%/}/health/live" 12 5 "Live health check"; then
            dump_remote_state
            exit 1
          fi

          if ! check_with_retry "${TEST_PUBLIC_ROOT_URL%/}/health/ready" 24 5 "Ready health check"; then
            dump_remote_state
            exit 1
          fi
